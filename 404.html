<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesús Vargas — el portafolio se mudó</title>

<!-- Le dice a Google que la version buena de esta pagina es la nueva, para que
     traslade el posicionamiento en vez de tratarlas como contenido duplicado. -->
<link rel="canonical" href="https://jesusvargas.studio/">

<!-- Respaldo si el navegador trae JavaScript desactivado. -->
<meta http-equiv="refresh" content="0; url=https://jesusvargas.studio/">

<meta name="robots" content="noindex, follow">

<style>
  :root {
    --fondo: #0B0D0E;
    --texto: #F2F0EC;
    --tenue: #6B7378;
    --senal: #FF4D18;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem;
    line-height: 1.6;
  }
  main { max-width: 32rem; text-align: left; }
  .etiqueta {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--senal);
    margin-bottom: 1.25rem;
  }
  /* Filete fino en lugar de tarjeta con sombra. */
  .etiqueta::after {
    content: "";
    display: block;
    width: 3rem;
    height: 1px;
    background: var(--senal);
    margin-top: 0.6rem;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
  p { color: var(--tenue); margin-bottom: 1.5rem; }
  a {
    color: var(--texto);
    text-decoration: none;
    border-bottom: 1px solid var(--senal);
    padding-bottom: 2px;
  }
  a:hover { color: var(--senal); }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: entra 0.4s ease-out; }
    @keyframes entra { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <div class="etiqueta">301 — Mudanza</div>
  <h1>El portafolio ahora vive en jesusvargas.studio</h1>
  <p>Te estamos llevando allá. Si no pasa nada en un segundo, entra tú:</p>
  <p><a href="https://jesusvargas.studio/">jesusvargas.studio</a></p>
</main>

<script>
  // Conserva la ruta cuando existe en el sitio nuevo, para que los enlaces
  // profundos no acaben todos en la portada. Los slugs de proyecto se migraron
  // sin cambios, salvo el que se renombro.
  (function () {
    var DESTINO = "https://jesusvargas.studio";
    var RENOMBRADOS = { "/projects/tower-of-hanoi": "/projects/hanoi-tower" };

    var ruta = window.location.pathname.replace(/\/+$/, "");
    if (RENOMBRADOS[ruta]) ruta = RENOMBRADOS[ruta];

    // Solo se conservan las rutas que el sitio nuevo tiene de verdad. Cualquier
    // otra cosa (el blog viejo, paginas del tema) va a la portada, que es mejor
    // que mandar a la gente a un 404.
    var CONSERVAR = /^\/projects(\/[a-z0-9-]+)?$/;
    var destino = CONSERVAR.test(ruta) ? DESTINO + ruta : DESTINO + "/";

    window.location.replace(destino);
  })();
</script>
</body>
</html>
